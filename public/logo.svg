<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="logoGradient" x1="12%" y1="12%" x2="88%" y2="88%">
      <stop offset="0%" stop-color="#BD22E8"/>
      <stop offset="30%" stop-color="#A228EA"/>
      <stop offset="65%" stop-color="#4F46E5"/>
      <stop offset="85%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#00A3FF"/>
    </linearGradient>
  </defs>

  <!-- Circular background badge -->
  <circle cx="256" cy="256" r="248" fill="url(#logoGradient)"/>

  <!-- Crisp white beamed musical note matching Screenshot_20260905-220116.jpg -->
  <g fill="#FFFFFF">
    <!-- Left Notehead: tilted ellipse -->
    <ellipse cx="198" cy="308" rx="42" ry="32" transform="rotate(-22 198 308)" />

    <!-- Right Notehead: tilted ellipse, elevated -->
    <ellipse cx="308" cy="280" rx="42" ry="32" transform="rotate(-22 308 280)" />

    <!-- Left Stem -->
    <path d="M 224,175 L 244,169 L 244,305 C 238,308 230,309 224,309 Z" />

    <!-- Right Stem -->
    <path d="M 334,142 L 354,136 L 354,277 C 348,280 340,281 334,281 Z" />

    <!-- Top Beam with rounded corners connecting the two stems -->
    <path d="
      M 224,152
      C 224,146 229,141 235,139
      L 343,109
      C 349,107 356,111 356,118
      L 356,146
      C 356,152 351,157 345,159
      L 237,189
      C 231,191 224,187 224,180
      Z
    " />
  </g>
</svg>